<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness-Tracker TikTok Ad</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*
 * 20-second 9:16 TikTok Shop ad for the vibration-alarm fitness band.
 * Star: a stick figure ("Stickman").
 *
 * Storyboard
 *   0.0 – 3.2  Hook: asleep in bed at night            "Jeden Morgen dasselbe Drama..."
 *   3.2 – 7.0  Loud phone alarm, everybody wakes up     "LAUTER HANDYALARM"
 *   7.0 – 11.0 Stickman reveals the band                "Die Lösung: Fitness-Tracker"
 *  11.0 – 15.0 Band vibrates, only he wakes, smiling    "Sanft aufwachen"
 *  15.0 – 18.0 Feature run: steps, LED time, colours
 *  18.0 – 20.0 Call to action: TikTok Shop
 *
 * window.renderFrame(t) draws the frame at time t (seconds); render.js uses it to export the MP4.
 * Opening this file in a browser plays the ad on loop.
 */
const W = 1080, H = 1920, DUR = 20;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Arial Black", "DejaVu Sans", "Liberation Sans", sans-serif';
const INK = '#16161d';
const PINK = '#fe2c55', CYAN = '#25f4ee', BAND_PINK = '#ff2f8e';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const outBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function line(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
const limb = (p, a, len) => [p[0] + Math.sin(a) * len, p[1] + Math.cos(a) * len];

// TikTok-style caption: white text, heavy black outline, pop-in.
function caption(text, y, size, t0, t, opts = {}) {
  const p = prog(t, t0, t0 + 0.35);
  if (p <= 0) return;
  const sc = outBack(p);
  ctx.save();
  ctx.translate(W / 2, y);
  ctx.scale(sc, sc);
  ctx.rotate(opts.rot || 0);
  ctx.font = `900 ${size}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  const lines = text.split('\n');
  lines.forEach((ln, i) => {
    const ly = (i - (lines.length - 1) / 2) * size * 1.15;
    if (opts.box) {
      const w = ctx.measureText(ln).width + size * 0.8;
      ctx.fillStyle = opts.box;
      rr(-w / 2, ly - size * 0.68, w, size * 1.36, size * 0.3);
      ctx.fill();
      ctx.fillStyle = opts.color || INK;
      ctx.fillText(ln, 0, ly + size * 0.04);
    } else {
      ctx.lineWidth = size * 0.22;
      ctx.strokeStyle = opts.stroke || '#000';
      ctx.strokeText(ln, 0, ly);
      ctx.fillStyle = opts.color || '#fff';
      ctx.fillText(ln, 0, ly);
    }
  });
  ctx.restore();
}

// ---------- stick figure ----------
// Angles: 0 = pointing down, PI = pointing up, +PI/2 = towards +x.
function stick(o) {
  const s = o.s || 1, rot = o.rot || 0, p = o.pose;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  const toWorld = q => [o.x + s * (q[0] * cos - q[1] * sin), o.y + s * (q[0] * sin + q[1] * cos)];
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.rotate(rot);
  ctx.scale(s, s);
  ctx.strokeStyle = o.color || INK;
  ctx.lineWidth = 15;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const hip = [0, 0], sh = [0, -150], neck = [0, -172];
  if (!o.noLegs) {
    for (const [u, l] of [[p.lUL || 0, p.lLL || 0], [p.rUL || 0, p.rLL || 0]]) {
      const k = limb(hip, u, 115);
      line([hip, k, limb(k, l, 115)]);
    }
  }
  line([hip, neck]);
  const le = limb(sh, p.lUA, 95), lh = limb(le, p.lLA, 90);
  const re = limb(sh, p.rUA, 95), rh = limb(re, p.rLA, 90);
  line([sh, le, lh]);
  line([sh, re, rh]);
  if (o.band) { // fitness band on right forearm
    const a = Math.atan2(rh[1] - re[1], rh[0] - re[0]);
    const bp = [lerp(re[0], rh[0], .7), lerp(re[1], rh[1], .7)];
    ctx.save();
    ctx.translate(bp[0], bp[1]);
    ctx.rotate(a);
    ctx.fillStyle = o.bandColor || '#111';
    rr(-17, -16, 34, 32, 8); ctx.fill();
    ctx.fillStyle = o.bandGlow ? '#fff' : '#9aa';
    ctx.shadowColor = '#fff'; ctx.shadowBlur = o.bandGlow ? 18 : 0;
    rr(-8, -9, 16, 18, 3); ctx.fill();
    ctx.restore();
  }
  // head
  const hc = [0, -236], R = 62;
  ctx.fillStyle = o.headFill || '#fff';
  ctx.beginPath(); ctx.arc(hc[0], hc[1], R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  if (o.hair === 'spiky') {
    ctx.lineWidth = 10;
    for (let i = -3; i <= 3; i++) {
      const a = Math.PI + i * 0.3;
      const b = limb(hc, a, R + 4), e = limb(hc, a + (rnd(i + (o.seed || 0)) - .5) * .4, R + 42);
      line([b, e]);
    }
  }
  ctx.lineWidth = 9;
  ctx.fillStyle = o.color || INK;
  const ey = hc[1] - 10;
  if (o.eyes === 'closed') {
    for (const ex of [-22, 22]) { ctx.beginPath(); ctx.arc(ex, ey, 11, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  } else if (o.eyes === 'happy') {
    for (const ex of [-22, 22]) { ctx.beginPath(); ctx.arc(ex, ey + 6, 12, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke(); }
  } else if (o.eyes === 'wide') {
    for (const ex of [-24, 24]) {
      ctx.lineWidth = 6; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey - 4, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = o.color || INK;
      ctx.beginPath(); ctx.arc(ex, ey - 4, 7, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    for (const ex of [-22, 22]) { ctx.beginPath(); ctx.arc(ex, ey, 8, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.lineWidth = 8;
  const my = hc[1] + 26;
  if (o.mouth === 'o') { ctx.beginPath(); ctx.ellipse(0, my, 13, 19, 0, 0, Math.PI * 2); ctx.stroke(); }
  else if (o.mouth === 'smile') { ctx.beginPath(); ctx.arc(0, my - 14, 26, 0.18 * Math.PI, 0.82 * Math.PI); ctx.stroke(); }
  else if (o.mouth === 'grin') {
    ctx.fillStyle = o.color || INK;
    ctx.beginPath(); ctx.arc(0, my - 8, 28, 0, Math.PI); ctx.closePath(); ctx.fill();
  }
  else if (o.mouth === 'frown') { ctx.beginPath(); ctx.arc(0, my + 18, 22, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); }
  else { line([[-16, my], [16, my]]); }
  if (o.brows) {
    ctx.lineWidth = 7;
    line([[-38, ey - 30], [-10, ey - 20]]);
    line([[38, ey - 30], [10, ey - 20]]);
  }
  ctx.restore();
  return { rHand: toWorld(rh), lHand: toWorld(lh), head: toWorld(hc), rElbow: toWorld(re) };
}

// Partner in bed: only head + hair bun visible above the blanket.
function partner(x, y, mood, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-Math.PI / 2 + 0.25);
  ctx.strokeStyle = INK; ctx.lineWidth = 13; ctx.lineCap = 'round';
  ctx.fillStyle = '#5b3a29';
  ctx.beginPath(); ctx.arc(0, -78, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); // bun
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, -10, 54, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 8;
  if (mood === 'angry') {
    for (const ex of [-19, 19]) { ctx.beginPath(); ctx.arc(ex, -16, 9, 1.1 * Math.PI, 1.9 * Math.PI); ctx.stroke(); }
    line([[-34, -36], [-8, -26]]); line([[34, -36], [8, -26]]);
    ctx.beginPath(); ctx.arc(0, 30, 16, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
  } else {
    for (const ex of [-19, 19]) { ctx.beginPath(); ctx.arc(ex, -12, 9, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 12, 12, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

// ---------- props ----------
function bed(night) {
  // headboard
  ctx.fillStyle = night ? '#3b3f63' : '#c9a27e';
  rr(40, 860, 70, 520, 24); ctx.fill();
  // frame + mattress
  ctx.fillStyle = night ? '#2a2d4a' : '#a77b57';
  rr(40, 1250, 760, 120, 18); ctx.fill();
  ctx.fillStyle = night ? '#d9dcf0' : '#ffffff';
  rr(90, 1150, 700, 110, 30); ctx.fill();
  // legs
  ctx.fillStyle = night ? '#23263f' : '#8a6142';
  ctx.fillRect(70, 1360, 34, 70); ctx.fillRect(740, 1360, 34, 70);
  // pillows
  ctx.fillStyle = night ? '#eef0ff' : '#fff';
  ctx.strokeStyle = night ? '#9aa0c8' : '#e2d6c9'; ctx.lineWidth = 6;
  rr(120, 990, 230, 120, 50); ctx.fill(); ctx.stroke();
  rr(130, 1070, 230, 110, 50); ctx.fill(); ctx.stroke();
}
function blanket(night, lift = 0) {
  ctx.fillStyle = night ? '#5865b8' : '#ffb38a';
  ctx.beginPath();
  ctx.moveTo(330, 1140 - lift * 0.2);
  ctx.bezierCurveTo(420, 1080 - lift, 650, 1070 - lift, 800, 1110);
  ctx.lineTo(820, 1290);
  ctx.lineTo(320, 1290);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = night ? '#47529c' : '#f29a6c'; ctx.lineWidth = 6;
  for (let i = 0; i < 4; i++) { line([[400 + i * 110, 1150], [440 + i * 110, 1280]]); }
}
function nightstand(night) {
  ctx.fillStyle = night ? '#4a4f7a' : '#d9a878';
  rr(820, 1170, 200, 260, 14); ctx.fill();
  ctx.fillStyle = night ? '#3a3e63' : '#c08f60';
  rr(840, 1250, 160, 70, 8); ctx.fill();
  ctx.fillStyle = night ? '#9aa0c8' : '#8a6142';
  ctx.beginPath(); ctx.arc(920, 1285, 9, 0, Math.PI * 2); ctx.fill();
}
function phone(x, y, ringing, t) {
  const sx = ringing ? Math.sin(t * 70) * 9 : 0, sr = ringing ? Math.sin(t * 55) * 0.08 : 0;
  ctx.save();
  ctx.translate(x + sx, y);
  ctx.rotate(sr);
  ctx.fillStyle = '#111';
  rr(-62, -120, 124, 240, 22); ctx.fill();
  ctx.fillStyle = ringing ? '#2b2b33' : '#1c1c22';
  rr(-52, -108, 104, 216, 14); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `700 44px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('7:30', 0, -40);
  if (ringing) {
    ctx.fillStyle = '#ff8a1f';
    rr(-40, 10, 80, 30, 15); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `700 15px ${FONT}`;
    ctx.fillText('SNOOZE', 0, 26);
  }
  ctx.restore();
  if (ringing) {
    // sound waves + bolts
    const ph = (t * 3) % 1;
    ctx.strokeStyle = '#ff3b3b'; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const r = 110 + ((ph + i / 3) % 1) * 140;
      ctx.globalAlpha = 1 - ((ph + i / 3) % 1);
      ctx.lineWidth = 12;
      ctx.beginPath(); ctx.arc(x, y, r, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    bolt(x - 150, y - 150 + Math.sin(t * 40) * 6, 1.1, -0.4);
    bolt(x + 110, y - 190 + Math.cos(t * 37) * 6, 0.9, 0.3);
  }
}
function bolt(x, y, s, r) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(r); ctx.scale(s, s);
  ctx.fillStyle = '#ff2a2a';
  ctx.beginPath();
  ctx.moveTo(-10, -60); ctx.lineTo(30, -60); ctx.lineTo(8, -12); ctx.lineTo(34, -12);
  ctx.lineTo(-22, 66); ctx.lineTo(-4, 6); ctx.lineTo(-30, 6); ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function windowFrame(x, y, w, h, sky, celestial) {
  ctx.fillStyle = sky; rr(x, y, w, h, 16); ctx.fill();
  celestial();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 14;
  rr(x, y, w, h, 16); ctx.stroke();
  line([[x + w / 2, y], [x + w / 2, y + h]]);
  line([[x, y + h / 2], [x + w, y + h / 2]]);
}

// Big hero render of the band (LED strap like the product photos).
function bigBand(x, y, s, color, ledColor, timeStr, tilt) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(s, s);
  const rx = 170, ry = 120;
  // back half of strap
  ctx.lineWidth = 58; ctx.lineCap = 'round';
  ctx.strokeStyle = shade(color, -0.35);
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, Math.PI, Math.PI * 2); ctx.stroke();
  // holes on back strap
  ctx.fillStyle = shade(color, -0.6);
  for (let i = 0; i < 5; i++) {
    const a = Math.PI * (1.15 + i * 0.12);
    ctx.beginPath(); ctx.arc(Math.cos(a) * rx, Math.sin(a) * ry, 7, 0, Math.PI * 2); ctx.fill();
  }
  // front half
  ctx.strokeStyle = color;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI); ctx.stroke();
  // ribs texture
  ctx.strokeStyle = shade(color, 0.18); ctx.lineWidth = 3;
  for (let i = 0; i < 16; i++) {
    const a = Math.PI * (0.05 + i * 0.058);
    const cx = Math.cos(a) * rx, cy = Math.sin(a) * ry;
    line([[cx - 4, cy - 24], [cx + 4, cy + 24]]);
  }
  // display panel
  ctx.fillStyle = shade(color, -0.25);
  rr(-120, ry - 40, 240, 80, 22); ctx.fill();
  ctx.fillStyle = ledColor;
  ctx.shadowColor = ledColor; ctx.shadowBlur = 28;
  ctx.font = `700 58px "DejaVu Sans Mono", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(timeStr, 0, ry + 3);
  ctx.restore();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = c => Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function vibes(x, y, t, s = 1) {
  const a = Math.abs(Math.sin(t * 22));
  ctx.strokeStyle = '#ff2f8e'; ctx.lineWidth = 9 * s; ctx.lineCap = 'round';
  for (const side of [-1, 1]) {
    for (let i = 1; i <= 2; i++) {
      ctx.globalAlpha = 0.5 + 0.5 * a;
      ctx.beginPath();
      ctx.arc(x, y, (30 + i * 24 + a * 6) * s, side < 0 ? Math.PI * 0.75 : -Math.PI * 0.25, side < 0 ? Math.PI * 1.25 : Math.PI * 0.25);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function zzz(x, y, t) {
  ctx.font = `900 54px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  for (let i = 0; i < 3; i++) {
    const ph = (t * 0.6 + i / 3) % 1;
    ctx.globalAlpha = Math.sin(ph * Math.PI);
    ctx.font = `900 ${34 + ph * 40}px ${FONT}`;
    ctx.fillText('Z', x + ph * 90 + Math.sin(ph * 6) * 10, y - ph * 200);
  }
  ctx.globalAlpha = 1;
}
function star(x, y, r, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const rad = i % 2 ? r * 0.38 : r; const an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * rad, Math.sin(an) * rad); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

// ---------- scenes ----------
const LYING = { lUA: 0.15, lLA: 0.1, rUA: 0.6, rLA: 2.6, lUL: 0, lLL: 0, rUL: 0, rLL: 0 };

function nightBg(t, flash) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#141a3a'); g.addColorStop(1, '#2a3266');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  windowFrame(560, 640, 300, 300, '#0b1030', () => {
    ctx.fillStyle = '#fff6c8';
    ctx.beginPath(); ctx.arc(640, 730, 48, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0b1030';
    ctx.beginPath(); ctx.arc(662, 716, 44, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 7; i++) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 3 + i); star(700 + rnd(i) * 140, 680 + rnd(i + 9) * 220, 7, 0); }
    ctx.globalAlpha = 1;
  });
  ctx.fillStyle = '#1d2347'; ctx.fillRect(0, 1560, W, H - 1560);
  if (flash) { ctx.fillStyle = `rgba(255,30,30,${0.18 + 0.18 * Math.abs(Math.sin(t * 12))})`; ctx.fillRect(0, 0, W, H); }
}

function scene1(t) { // 0 – 3.2
  nightBg(t, false);
  ctx.save(); ctx.translate(0, 130);
  bed(true);
  partner(255, 1020, 'sleep', t);
  stick({ x: 520, y: 1135, rot: -Math.PI / 2, pose: LYING, eyes: 'closed', mouth: 'flat' });
  blanket(true);
  nightstand(true);
  phone(915, 1050, false, t);
  zzz(300, 1000, t);
  ctx.restore();
  caption('Jeden Morgen\ndasselbe Drama...', 420, 92, 0.15, t);
  // subtle zoom-in tension
}

function scene2(t) { // 3.2 – 7.0
  const lt = t - 3.2;
  const up = ease(prog(lt, 0.25, 0.6));
  const shake = lt < 3.6 ? Math.sin(t * 60) * 10 * (1 - prog(lt, 0, 3.6) * 0.5) : 0;
  ctx.save(); ctx.translate(shake, Math.cos(t * 53) * shake * 0.5);
  nightBg(t, true);
  ctx.save(); ctx.translate(0, 130);
  bed(true);
  partner(255, 1020, 'angry', t);
  // partner's pillow over the head
  if (lt > 0.9) {
    const pp = ease(prog(lt, 0.9, 1.3));
    ctx.save(); ctx.translate(lerp(230, 270, pp), lerp(1110, 990, pp)); ctx.rotate(-0.3);
    ctx.fillStyle = '#eef0ff'; ctx.strokeStyle = '#9aa0c8'; ctx.lineWidth = 6;
    rr(-120, -55, 240, 110, 50); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  const rot = lerp(-Math.PI / 2, -0.12, up);
  const jump = Math.sin(clamp(lt / 0.6) * Math.PI) * 120;
  const legA = rot + Math.PI / 2;
  stick({
    x: lerp(520, 470, up), y: lerp(1135, 1095, up) - jump, rot,
    pose: {
      lUA: lerp(0.15, Math.PI - 0.75, up), lLA: lerp(0.1, Math.PI - 0.35, up), rUA: lerp(0.6, -(Math.PI - 0.75), up), rLA: lerp(2.6, -(Math.PI - 0.35), up),
      lUL: legA, lLL: legA, rUL: legA, rLL: legA
    },
    eyes: up > 0.3 ? 'wide' : 'closed', mouth: up > 0.3 ? 'o' : 'flat', hair: up > 0.3 ? 'spiky' : null, seed: Math.floor(t * 8)
  });
  blanket(true, up * 30);
  nightstand(true);
  phone(915, 1050, true, t);
  ctx.restore();
  caption('LAUTER\nHANDYALARM', 360, 120, 3.3, t, { color: '#ff3b3b', stroke: '#fff' });
  caption('...und das ganze Haus\nist wach!', 640, 66, 4.6, t);
}

function scene3(t) { // 7.0 – 11.0
  const lt = t - 7;
  // bright burst background
  const g = ctx.createRadialGradient(W / 2, 820, 50, W / 2, 820, 1300);
  g.addColorStop(0, '#fff7ef'); g.addColorStop(0.5, '#ffe1ec'); g.addColorStop(1, '#ffb3cf');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 820); ctx.rotate(t * 0.25);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < 14; i++) {
    ctx.rotate(Math.PI * 2 / 14);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-70, -1500); ctx.lineTo(70, -1500); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // floor
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.ellipse(W / 2, 1640, 380, 50, 0, 0, Math.PI * 2); ctx.fill();

  const raise = outBack(prog(lt, 0.2, 0.75));
  const bob = Math.sin(lt * 5) * 8;
  const hands = stick({
    x: 450, y: 1480 + bob, s: 1.5,
    pose: {
      lUA: -0.75, lLA: 0.7, rUA: lerp(0.2, Math.PI - 0.55, raise), rLA: lerp(0.1, Math.PI - 0.15, raise),
      lUL: -0.22, lLL: -0.1, rUL: 0.22, rLL: 0.1
    },
    eyes: 'open', mouth: 'grin', band: true
  });
  // hero band in the raised hand
  const bp = prog(lt, 0.45, 0.9);
  if (bp > 0) {
    const s = outBack(bp) * 0.8;
    // sparkles
    ctx.fillStyle = '#ffd34d';
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + lt * 1.5, r = 200 + Math.sin(lt * 4 + i) * 20;
      star(hands.rHand[0] + 60 + Math.cos(a) * r, hands.rHand[1] - 170 + Math.sin(a) * r * 0.8, 18 * bp, lt * 2 + i);
    }
    bigBand(hands.rHand[0] + 60, hands.rHand[1] - 170, s, '#1b1b1f', '#ffffff', '07:30', Math.sin(lt * 2.2) * 0.12);
  }
  caption('Die Lösung:', 300, 84, 7.15, t, { color: INK, stroke: '#fff' });
  caption('Fitness-Tracker', 420, 104, 7.5, t, { box: PINK, color: '#fff' });
  caption('mit VIBRATIONSALARM', 545, 70, 8.0, t, { box: '#fff', color: INK });
}

function morningBg(t, lt) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#fff3dc'); g.addColorStop(1, '#ffd9b0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  windowFrame(560, 640, 300, 300, '#a9dcff', () => {
    const sy = lerp(940, 760, ease(prog(lt, 0, 3)));
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.arc(710, sy, 62, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 8;
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + t * 0.4; line([limb([710, sy], a, 80), limb([710, sy], a, 105)]); }
  });
  ctx.fillStyle = '#f2c79a'; ctx.fillRect(0, 1560, W, H - 1560);
}

function scene4(t) { // 11.0 – 15.0
  const lt = t - 11;
  morningBg(t, lt);
  ctx.save(); ctx.translate(0, 130);
  bed(false);
  partner(255, 1020, 'sleep', t);
  const up = ease(prog(lt, 1.9, 2.5));
  const vib = lt < 1.9;
  const jitter = vib ? Math.sin(t * 90) * 3 : 0;
  const rot = lerp(-Math.PI / 2, -0.08, up);
  const legA = rot + Math.PI / 2;
  const st = stick({
    x: lerp(520, 470, up) + jitter, y: lerp(1135, 1095, up), rot,
    pose: {
      lUA: lerp(0.15, Math.PI - 0.8, up), lLA: lerp(0.1, Math.PI - 0.45, up),
      rUA: lerp(0.6, -(Math.PI - 0.8), up), rLA: lerp(2.6, -(Math.PI - 0.45), up),
      lUL: legA, lLL: legA, rUL: legA, rLL: legA
    },
    eyes: up > 0.5 ? 'happy' : 'closed', mouth: up > 0.5 ? 'smile' : (lt > 0.6 ? 'smile' : 'flat'),
    band: true, bandColor: '#111', bandGlow: vib
  });
  blanket(false, up * 30);
  nightstand(false);
  phone(915, 1050, false, t); // phone stays silent
  zzz(200, 960, t);
  if (vib) {
    const bpos = [lerp(st.rElbow[0], st.rHand[0], .7), lerp(st.rElbow[1], st.rHand[1], .7)];
    vibes(bpos[0], bpos[1], t, 1.3);
    ctx.save(); ctx.translate(bpos[0] + 10, bpos[1] - 150); ctx.rotate(-0.12);
    ctx.font = `900 64px ${FONT}`; ctx.textAlign = 'center';
    ctx.lineWidth = 12; ctx.strokeStyle = '#fff'; ctx.strokeText('bzz bzz', Math.sin(t * 40) * 4, 0);
    ctx.fillStyle = BAND_PINK; ctx.fillText('bzz bzz', Math.sin(t * 40) * 4, 0);
    ctx.restore();
  }
  // "silent" badge on phone
  ctx.save(); ctx.translate(915, 900);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#e23'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-14, -12); ctx.lineTo(-4, -12); ctx.lineTo(10, -24); ctx.lineTo(10, 24); ctx.lineTo(-4, 12); ctx.lineTo(-14, 12); ctx.closePath(); ctx.stroke();
  line([[-30, -30], [30, 30]]);
  ctx.restore();
  ctx.restore();

  caption('Sanft aufwachen', 330, 96, 11.1, t, { color: INK, stroke: '#fff' });
  caption('Vibriert nur an DEINEM\nHandgelenk', 500, 62, 11.6, t, { color: '#fff', stroke: INK });
  if (lt > 2.4) caption('Partner schläft weiter', 1660, 60, 13.4, t, { box: INK, color: '#fff' });
}

function scene5(t) { // 15.0 – 18.0
  const lt = t - 15;
  ctx.fillStyle = '#f4f6fb'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e7ebf6';
  ctx.beginPath(); ctx.arc(980, 260, 360, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(80, 1700, 300, 0, Math.PI * 2); ctx.fill();
  // ground scroll
  ctx.strokeStyle = '#c5cbe0'; ctx.lineWidth = 8;
  line([[0, 1500], [W, 1500]]);
  for (let i = 0; i < 8; i++) {
    const x = ((i * 180 - lt * 600) % (W + 180) + W + 180) % (W + 180) - 90;
    line([[x, 1540], [x + 60, 1540]]);
  }
  const ph = lt * 9;
  const sw = Math.sin(ph);
  const hands = stick({
    x: 300, y: 1265 - Math.abs(Math.cos(ph)) * 14, s: 1.0,
    pose: {
      lUL: sw * 0.55, lLL: sw * 0.55 - 0.35 * (1 + Math.cos(ph)) * 0.5, rUL: -sw * 0.55, rLL: -sw * 0.55 - 0.35 * (1 - Math.cos(ph)) * 0.5,
      lUA: -sw * 0.6, lLA: -sw * 0.6 + 0.9, rUA: sw * 0.6, rLA: sw * 0.6 + 0.9
    },
    eyes: 'open', mouth: 'smile', band: true, bandGlow: true
  });
  // step counter bubble
  const steps = Math.floor(lerp(0, 10000, ease(prog(lt, 0.1, 2.6))));
  ctx.save(); ctx.translate(300, 730);
  ctx.fillStyle = '#111'; rr(-190, -70, 380, 140, 40); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-20, 68); ctx.lineTo(20, 68); ctx.lineTo(0, 110); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 16;
  ctx.font = `700 74px "DejaVu Sans Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(steps.toLocaleString('de-DE'), 0, -2);
  ctx.restore();
  ctx.font = `900 34px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.fillText('SCHRITTE', 300, 880);

  // feature chips
  const feats = [
    ['Vibrationsalarm', PINK],
    ['Schrittzähler', '#111'],
    ['LED-Uhrzeit', '#2a7fff'],
    ['USB-Aufladung', '#16a34a'],
    ['Schwarz & Pink', BAND_PINK]
  ];
  feats.forEach(([label, col], i) => {
    const p = outBack(prog(lt, 0.15 + i * 0.4, 0.5 + i * 0.4));
    if (p <= 0) return;
    const y = 920 + i * 105;
    ctx.save(); ctx.translate(690, y); ctx.scale(p, p);
    ctx.font = `900 36px ${FONT}`;
    const w = 440;
    ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.15)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
    rr(-w / 2, -42, w, 84, 42); ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(-w / 2 + 44, 0, 20, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    line([[-w / 2 + 35, 0], [-w / 2 + 42, 8], [-w / 2 + 54, -8]]);
    ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(label, -w / 2 + 76, 2);
    ctx.restore();
  });
  caption('Dein Begleiter\nfür jeden Tag', 330, 88, 15.05, t, { color: INK, stroke: '#fff' });
}

function scene6(t) { // 18.0 – 20.0
  const lt = t - 18;
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0d0d12'); g.addColorStop(1, '#1d1030');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // glow blobs
  for (const [x, y, c] of [[250, 700, 'rgba(37,244,238,0.25)'], [830, 900, 'rgba(254,44,85,0.3)']]) {
    const rg = ctx.createRadialGradient(x, y, 10, x, y, 420);
    rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  const p = outBack(prog(lt, 0, 0.45));
  bigBand(320, 760 + Math.sin(lt * 4) * 10, 0.8 * p, '#1b1b1f', '#ffffff', '10:25', -0.18);
  bigBand(720, 840 + Math.cos(lt * 4) * 10, 0.8 * p, BAND_PINK, '#ffd6f0', '10:25', 0.18);

  caption('Hol dir deinen', 300, 76, 18.05, t);
  caption('Fitness-Tracker!', 410, 104, 18.2, t, { color: CYAN });

  // CTA button
  const bp = outBack(prog(lt, 0.35, 0.75));
  if (bp > 0) {
    const pulse = 1 + Math.sin(lt * 10) * 0.035;
    ctx.save(); ctx.translate(W / 2, 1230); ctx.scale(bp * pulse, bp * pulse);
    ctx.shadowColor = PINK; ctx.shadowBlur = 50;
    ctx.fillStyle = PINK; rr(-400, -95, 800, 190, 95); ctx.fill();
    ctx.shadowBlur = 0;
    // cart icon
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    line([[-330, -40], [-305, -40], [-285, 25], [-215, 25], [-200, -20], [-298, -20]]);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-280, 45, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-222, 45, 9, 0, Math.PI * 2); ctx.fill();
    ctx.font = `900 60px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('Jetzt im', -170, -30);
    ctx.fillText('TikTok Shop', -170, 38);
    ctx.restore();
  }
  // small stickman pointing at the button
  const sp = prog(lt, 0.5, 0.9);
  if (sp > 0) {
    ctx.globalAlpha = sp;
    stick({
      x: 150, y: 1600, s: 0.6, color: '#fff', headFill: '#0d0d12',
      pose: { lUA: -0.3, lLA: -0.2, rUA: 2.3 + Math.sin(lt * 12) * 0.1, rLA: 2.3, lUL: -0.25, lLL: -0.15, rUL: 0.25, rLL: 0.15 },
      eyes: 'open', mouth: 'grin', band: true, bandGlow: true
    });
    ctx.globalAlpha = 1;
  }
  caption('Tippe auf den Warenkorb', 1400, 50, 18.9, t, { color: '#fff', stroke: '#000' });
}

// quick white flash on scene cuts
function cutFlash(t) {
  for (const c of [3.2, 7.0, 11.0, 15.0, 18.0]) {
    const d = Math.abs(t - c);
    if (d < 0.12) { ctx.fillStyle = `rgba(255,255,255,${1 - d / 0.12})`; ctx.fillRect(0, 0, W, H); }
  }
}

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.shadowOffsetY = 0;
  if (t < 3.2) scene1(t);
  else if (t < 7) scene2(t);
  else if (t < 11) scene3(t);
  else if (t < 15) scene4(t);
  else if (t < 18) scene5(t);
  else scene6(t);
  cutFlash(t);
}
window.renderFrame = renderFrame;
window.DURATION = DUR;

if (!/render=1/.test(location.search)) {
  const start = performance.now();
  const loop = now => { renderFrame(((now - start) / 1000) % DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else {
  renderFrame(0);
}
</script>
</body>
