<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Ad</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
  // ?v=v1|v2|v3 picks the variant (ad-v1.js …)
  const v = (new URLSearchParams(location.search).get('v') || 'v1').replace(/[^a-z0-9]/g, '');
  document.write(`<script src="ad-${v}.js"><\/script>`);
</script>
<script src="../tools/lib.js"></script>
<script src="../tools/gfx.js"></script>
<script src="../tools/real.js"></script>
</body>
</html>
